<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Core Rome - Customer Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo-section">

        <img src="logo.jpeg" alt="Steel Core Rome Logo" class="logo">

        <div>
            <h1>Steel Core Rome</h1>
            <p class="tagline">Cards • Community • Competition</p>
        </div>

    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="problem2_contact.html">Contact</a>
        <a href="problem3_items.html">Shop</a>
        <a href="customer_form.html">Customer Form</a>
    </nav>

</header>

<main>

    <section class="form-container">

        <h2>Customer Registration</h2>

        <p>
            Register to receive event updates and store announcements.
        </p>

        <form id="customerForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <label for="favoriteGame">Favorite Trading Card Game</label>

            <input list="games" id="favoriteGame">

            <datalist id="games">
                <option value="Pokemon">
                <option value="Magic: The Gathering">
                <option value="Yu-Gi-Oh!">
                <option value="One Piece">
                <option value="Disney Lorcana">
            </datalist>

            <button type="button" id="submitBtn">
                Submit Registration
            </button>

        </form>

    </section>

</main>

<footer>

    <p>&copy; 2026 Steel Core Rome</p>

    <p class="student-name">
        Created by Randy Nunez
    </p>

</footer>

<script src="script.js"></script>

</body>
</html>
